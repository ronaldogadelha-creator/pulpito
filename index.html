<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Púlpito</title>
<meta name="description" content="Esboços de sermão com cronômetro e ritmo por movimento.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1E3A6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Púlpito">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<style>
html,body{margin:0}
:root{color-scheme:light; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: biblioteca em cartões → editor de colagem → leitura corrida com barra de tempo fixa em cima e controles fixos embaixo. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#EDEFF3;
  --fg:#141921; --muted:#5B6673; --line:#D8DDE4;
  --navy:#1E3A6B; --navy-soft:#E6EBF5;
  --wine:#8C2033; --wine-soft:#F6E7E9;
  --ochre:#8A5A0B; --ochre-soft:#F7EEDC;
  --verde:#1A6049; --verde-soft:#E2F0E9;
  --roxo:#5B3A96; --roxo-soft:#EDE8F8;
  --ahead:#1C6B4C; --behind:#A8641B; --over:#B0241C;
  --shadow:0 1px 2px rgba(20,25,33,.06), 0 6px 20px rgba(20,25,33,.07);
  --display: Georgia, "Iowan Old Style", "Times New Roman", serif;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
  --ps:21; /* corpo do púlpito, em px */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1117; --surface:#161C25; --surface-2:#1E2633;
  --fg:#E7E9ED; --muted:#98A3B1; --line:#2A3443;
  --navy:#9BBCF0; --navy-soft:#1A2740;
  --wine:#EB9AA4; --wine-soft:#2E1C21;
  --ochre:#DFB25C; --ochre-soft:#2C2416;
  --verde:#6FD1AB; --verde-soft:#14281F;
  --roxo:#B49BEE; --roxo-soft:#211B33;
  --ahead:#64D3A6; --behind:#E0A95C; --over:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161C25; --surface-2:#1E2633;
  --fg:#E7E9ED; --muted:#98A3B1; --line:#2A3443;
  --navy:#9BBCF0; --navy-soft:#1A2740;
  --wine:#EB9AA4; --wine-soft:#2E1C21;
  --ochre:#DFB25C; --ochre-soft:#2C2416;
  --verde:#6FD1AB; --verde-soft:#14281F;
  --roxo:#B49BEE; --roxo-soft:#211B33;
  --ahead:#64D3A6; --behind:#E0A95C; --over:#FF7A6B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--ui); -webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer; background:none; border:none}
:focus-visible{outline:2px solid var(--navy); outline-offset:2px; border-radius:6px}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:18px 28px; max-width:860px; margin:0 auto}
h1,h2,h3{text-wrap:balance; margin:0}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:10px 15px; border-radius:10px; background:var(--surface); border:1px solid var(--line); font-weight:500; font-size:14px; box-shadow:var(--shadow)}
.btn.primary{background:var(--navy); border-color:var(--navy); color:#fff}
:root[data-theme="dark"] .btn.primary, :root:not([data-theme="light"]) .btn.primary{color:#0D1117}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .btn.primary{color:#fff} }
.btn.ghost{background:transparent; box-shadow:none}
.btn.danger{color:var(--over); border-color:var(--line)}
.btn:disabled{opacity:.45; cursor:default}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spacer{flex:1 1 auto}

/* ---------- biblioteca ---------- */
.lib-head{display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:18px}
.brand{font-family:var(--display); font-weight:700; font-size:27px; letter-spacing:-.01em; line-height:1.1}
.brand span{color:var(--navy)}
.cards{display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:16px; display:flex; flex-direction:column; gap:8px; min-width:0; text-align:left; width:100%}
.card h3{font-family:var(--display); font-size:19px; font-weight:600; line-height:1.25; min-width:0; overflow-wrap:anywhere}
.card .ref{color:var(--wine); font-family:var(--display); font-weight:600; font-size:14px}
.card .meta{display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums}
.pasta h3{display:flex; align-items:center; gap:9px}
.pasta h3 .ic{width:22px; height:17px; flex:none; border-radius:2px 5px 5px 5px; background:var(--navy); position:relative}
.pasta h3 .ic::before{content:""; position:absolute; top:-4px; left:0; width:9px; height:5px; border-radius:2px 2px 0 0; background:var(--navy)}
.pasta.solta h3 .ic{background:var(--muted)}
.pasta.solta h3 .ic::before{background:var(--muted)}
.num-badge{flex:none; font-variant-numeric:tabular-nums; font-family:var(--ui); font-size:12px; font-weight:600; color:var(--wine); background:var(--wine-soft); border-radius:6px; padding:2px 7px; align-self:flex-start}
.titlerow{display:flex; gap:8px; align-items:flex-start; min-width:0}
.novapasta{margin-top:16px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.novapasta input{flex:1 1 200px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 13px; font-size:15px}
.card-actions{display:flex; gap:6px; border-top:1px solid var(--line); padding-top:10px; margin-top:2px}
.card-actions .btn{padding:7px 11px; font-size:13px; box-shadow:none}
.empty{background:var(--surface); border:1px dashed var(--line); border-radius:14px; padding:26px 20px; text-align:center; display:grid; gap:12px; justify-items:center}
.empty p{color:var(--muted); font-size:14px; max-width:42ch; margin:0; line-height:1.5}

/* ---------- editor ---------- */
.field{display:grid; gap:6px; margin-bottom:14px}
.field label{font-size:12px; font-weight:600; color:var(--muted); letter-spacing:.03em}
.field input, .field textarea, .field select{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:11px 13px; width:100%; font-size:15px}
.field select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:36px}
.field textarea{min-height:46vh; font-family:var(--display); line-height:1.5; resize:vertical}
.field .hint{font-size:12px; color:var(--muted); line-height:1.5}
.stats{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0 16px}
.stat{background:var(--surface-2); border-radius:9px; padding:7px 11px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.stat b{color:var(--fg); font-weight:600}
.drop{border:1px dashed var(--line); background:var(--surface); border-radius:14px; padding:18px 16px; display:grid; gap:9px; justify-items:center; text-align:center; margin-bottom:16px}
.drop.on{border-color:var(--navy); background:var(--navy-soft)}
.drop b{font-family:var(--display); font-size:17px; font-weight:600}
.drop .ou{font-size:12px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase}
.drop .hint{font-size:12px; color:var(--muted); line-height:1.5; max-width:46ch}
.drop label.btn{cursor:pointer}

/* ---------- púlpito ---------- */
#view-pulpito{position:relative}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); border-bottom:1px solid var(--line);
  padding-left:max(14px, env(safe-area-inset-left,0px)); padding-right:max(14px, env(safe-area-inset-right,0px)); padding-block:9px 7px; box-shadow:var(--shadow)}
.topbar.flash{animation:flash 1.6s ease-out 2}
@keyframes flash{0%,100%{background:var(--surface)} 35%{background:var(--navy-soft)}}
@media (prefers-reduced-motion: reduce){ .topbar.flash{animation:none; outline:2px solid var(--navy); outline-offset:-2px} }
.clockrow{display:flex; align-items:flex-start; gap:8px}
.col{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:3px; align-items:flex-start}
.col.c{align-items:center} .col.r{align-items:flex-end}
.num{font-family:var(--ui); font-weight:600; font-size:34px; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em; white-space:nowrap}
.num.clock{font-size:43px; font-weight:700}
.num.remain.warn{color:var(--behind)} .num.remain.over{color:var(--over)}
.lbl{font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
@media (max-width:420px){ .num{font-size:28px} .num.clock{font-size:35px} .lbl{font-size:9.5px; letter-spacing:.05em} }
.pace{font-size:15px; font-weight:600; padding:4px 11px; border-radius:999px; background:var(--surface-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.pace.ahead{color:var(--ahead)} .pace.behind{color:var(--behind)} .pace.late{color:var(--over)}
.track{position:relative; height:9px; margin:9px 0 6px; display:flex; gap:2px}
.seg{flex:1 1 auto; background:var(--surface-2); border-radius:3px; position:relative; overflow:hidden; min-width:3px; padding:0; border:none}
.seg.done i{width:100%} .seg i{position:absolute; inset:0 auto 0 0; width:0; background:var(--navy); display:block}
.seg.cur{box-shadow:0 0 0 2px var(--navy)}
.ghost-tick{position:absolute; top:-3px; width:2px; height:15px; background:var(--muted); border-radius:2px; transform:translateX(-1px)}
.ghost-tick.late{background:var(--over)}
.wherebar{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); min-width:0}
.wherebar b{color:var(--navy); font-weight:600; font-family:var(--display); font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.num.hora{color:var(--fg)}

#sermao{padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:max(18px, env(safe-area-inset-right,0px));
  padding-block:20px 0; width:100%; margin:0 auto; font-family:var(--display); font-size:calc(var(--ps) * 1px); line-height:1.52}
#sermao .doc-title{font-size:1.12em; font-weight:700; text-align:center; line-height:1.3; color:var(--navy); margin-bottom:.2em}
#sermao .doc-sub{text-align:center; color:var(--muted); font-size:.62em; font-family:var(--ui); letter-spacing:.04em; text-transform:uppercase; margin-bottom:1.4em}
.sec{scroll-margin-top:120px}
.head{font-weight:700; color:var(--navy); text-align:center; font-size:.95em; letter-spacing:.02em; margin:1.5em 0 .5em; padding:.25em .4em; background:var(--navy-soft); border-radius:8px}
.mov{margin:1.7em 0 .6em; border-left:4px solid var(--navy); padding-left:.6em}
.mov .n{font-family:var(--ui); font-size:.55em; font-weight:600; letter-spacing:.12em; color:var(--muted)}
.mov h2{font-size:1.06em; font-weight:700; color:var(--navy); line-height:1.25}
.mov .vv{font-family:var(--ui); font-size:.58em; color:var(--wine); font-weight:500}
.big{margin:1em 0; padding:.7em .85em; border:1px solid var(--wine); border-radius:12px; background:var(--wine-soft); color:var(--wine); font-weight:600; font-size:1.02em; line-height:1.4}
.map{margin:.8em 0; padding:.55em .8em; border-radius:10px; background:var(--surface-2); color:var(--muted); font-size:.84em; line-height:1.45}
.verse{margin:.85em 0; padding:.5em .9em; border-left:3px solid var(--wine); background:var(--wine-soft); color:var(--wine); font-style:italic; font-weight:500; line-height:1.45}
.lit{margin:.7em 0; padding:.5em .85em; border-left:3px solid var(--navy); background:var(--navy-soft); font-weight:600}
.bloco{font-family:var(--ui); font-size:.56em; font-weight:600; letter-spacing:.14em; color:var(--navy); margin:1.3em 0 .35em; display:flex; align-items:center; gap:8px}
.bloco::after{content:""; flex:1; height:1px; background:var(--line)}
.it{display:flex; gap:.45em; margin:.52em 0; align-items:baseline}
.it.l1{padding-left:1.4em} .it.l2{padding-left:2.8em}
.it .mk{color:var(--navy); font-weight:700; flex:none; font-variant-numeric:tabular-nums}
.it.l1 .mk, .it.l2 .mk{font-weight:600; color:var(--muted)}
.it .tx{min-width:0; flex:1}
.it.l0 > .tx{font-weight:500}
.it.mark{padding:.5em .85em; border-left:3px solid var(--line); border-radius:0 10px 10px 0; margin:.8em 0; background:var(--surface-2)}
.it.mark.l1{padding-left:.85em; margin-left:1.4em}
.it.mark.l2{padding-left:.85em; margin-left:2.8em}
.it.mark .tx{display:block; font-weight:600}
.it.mark .mk{font-weight:700}
.it.m-pr{border-color:var(--navy); background:var(--navy-soft)}
.it.m-pr .mk{color:var(--navy)}
.it.m-ap{border-color:var(--verde); background:var(--verde-soft)}
.it.m-il{border-color:var(--ochre); background:var(--ochre-soft)}
.it.m-sl{border-color:var(--roxo); background:var(--roxo-soft)}
.labels{display:flex; flex-wrap:wrap; gap:.35em; margin-bottom:.3em}
.labels.cent{justify-content:center}
.head .labels{margin-bottom:.35em}
.big .labels, .map .labels{margin-bottom:.4em}
.tag{font-family:var(--ui); font-size:.56em; font-weight:600; letter-spacing:.1em; padding:.22em .6em; border-radius:999px; white-space:nowrap; align-self:flex-start}
.tag.ap{background:var(--verde); color:var(--verde-soft)}
.tag.il{background:var(--ochre); color:var(--ochre-soft)}
.tag.sl{background:var(--roxo); color:var(--roxo-soft)}
.endpad{height:46vh}

.bottombar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line);
  padding-left:max(12px, env(safe-area-inset-left,0px)); padding-right:max(12px, env(safe-area-inset-right,0px));
  padding-top:9px; padding-bottom:calc(9px + env(safe-area-inset-bottom,0px)); display:flex; gap:8px; align-items:center}
.cbtn{width:44px; height:44px; border-radius:12px; border:1px solid var(--line); background:var(--surface-2); display:grid; place-items:center; font-size:15px; font-weight:600; flex:none}
.cbtn.go{background:var(--navy); border-color:var(--navy); color:#fff; width:58px}
:root[data-theme="dark"] .cbtn.go{color:#0D1117}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .cbtn.go{color:#0D1117} }
.sheet{position:fixed; inset:auto 0 0 0; z-index:40; background:var(--surface); border-top:1px solid var(--line); border-radius:16px 16px 0 0; box-shadow:var(--shadow);
  padding-left:max(18px, env(safe-area-inset-left,0px)); padding-right:max(18px, env(safe-area-inset-right,0px));
  padding-top:16px; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px)); max-height:78vh; overflow:auto; max-width:860px; margin:0 auto}
.sheet h3{font-family:var(--display); font-size:19px; margin-bottom:4px}
.tbl{width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; font-variant-numeric:tabular-nums}
.tbl th{text-align:left; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:6px 4px; border-bottom:1px solid var(--line)}
.tbl td{padding:7px 4px; border-bottom:1px solid var(--line)}
.tbl td.d{font-weight:600; text-align:right}
.tbl td.d.ahead{color:var(--ahead)} .tbl td.d.behind{color:var(--behind)}
.tbl td.nm{font-family:var(--display); font-weight:600}
.scrim{position:fixed; inset:0; z-index:35; background:rgba(10,14,20,.42)}
.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); z-index:50; background:var(--fg); color:var(--bg); padding:9px 15px; border-radius:999px; font-size:13px; font-weight:500; box-shadow:var(--shadow)}
</style>
</head>
<body>
<div id="app"></div>
<script src="./jszip.min.js"></script>
<script>
"use strict";
/* ========== utilidades ========== */
const $ = (s, r) => (r || document).querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt != null) n.textContent = txt; return n; };
const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));
const mmss = ms => { const neg = ms < 0; ms = Math.abs(ms); const t = Math.floor(ms / 1000); const m = Math.floor(t / 60), s = t % 60; return (neg ? "-" : "") + m + ":" + String(s).padStart(2, "0"); };
const uid = () => "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const LS = "pulpito.v2";

function lsGet() { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) { return {}; } }
function lsSet(o) { try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) { } }

/* ========== estado ========== */
const S = {
  view: "lib", sermoes: [], pastas: [], pastaAberta: null, atual: null, db: null, podeNuvem: false,
  ps: 21, tema: null,
  t: { rodando: false, t0: 0, acum: 0, alertas: {}, log: [], secAtual: -1 },
  secs: [], tick: null
};

/* ========== armazenamento (só neste aparelho) ========== */
async function carregar() {
  const local = lsGet();
  S.ps = local.ps || 21;
  S.pastas = local.pastas || [];
  S.sermoes = (local.sermoes || []).sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
}
function salvarLocal() { const o = lsGet(); o.sermoes = S.sermoes; o.ps = S.ps; o.pastas = S.pastas; lsSet(o); }
async function salvar(s) {
  s.atualizadoEm = Date.now();
  const i = S.sermoes.findIndex(x => x.id === s.id);
  if (i >= 0) S.sermoes[i] = s; else S.sermoes.unshift(s);
  S.sermoes.sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
  salvarLocal();
}
async function apagar(id) { S.sermoes = S.sermoes.filter(x => x.id !== id); salvarLocal(); }

function exportar() {
  if (!S.sermoes.length) return toast("Não há esboços para exportar.");
  const dados = JSON.stringify({ app: "pulpito", versao: 2, em: new Date().toISOString(), pastas: S.pastas || [], sermoes: S.sermoes }, null, 1);
  const url = URL.createObjectURL(new Blob([dados], { type: "application/json" }));
  const a = document.createElement("a");
  const d = new Date(), p = n => String(n).padStart(2, "0");
  a.href = url; a.download = "esbocos-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(S.sermoes.length + " esboço(s) no arquivo.");
}
async function importar(file) {
  try {
    const dados = JSON.parse(await file.text());
    const lista = Array.isArray(dados) ? dados : (dados.sermoes || []);
    if (!lista.length) return toast("Esse arquivo não tem esboços.");
    (dados.pastas || []).forEach(n => { if (n && !(S.pastas || []).includes(n)) S.pastas = [...(S.pastas || []), n]; });
    let novos = 0, atualizados = 0;
    lista.forEach(s => {
      if (!s || !s.id || !s.texto) return;
      const i = S.sermoes.findIndex(x => x.id === s.id);
      if (i < 0) { S.sermoes.push(s); novos++; }
      else if ((s.atualizadoEm || 0) > (S.sermoes[i].atualizadoEm || 0)) { S.sermoes[i] = s; atualizados++; }
    });
    S.sermoes.sort((a, b) => (b.atualizadoEm || 0) - (a.atualizadoEm || 0));
    salvarLocal(); render();
    toast(novos + " novo(s), " + atualizados + " atualizado(s).");
  } catch (e) { toast("Não consegui ler esse arquivo de esboços."); }
}

/* ========== leitor do esboço ==========
   Entende o formato dos esboços: cabeçalhos em caixa alta, movimentos em
   romanos, [BIG IDEIA], versículos, itens 1./a./i., blocos ▸, literais ▸▸,
   (APLICAÇÃO), (ILUSTRAÇÃO) e [SLIDE NN].                                   */

function parse(bruto) {

    if (!t) continue;

    // marcadores que saem do texto
    const tags = [];
    t = puxaTags(t, tags);
    if (!t) continue;

    // título do documento: primeira linha com | ou com travessão + nome
    if (!titulo && /\|/.test(t)) {
      const p = t.split("|").map(x => x.trim());
      const cab = p[0];
      const m = cab.match(/^(.*?)[\s]*[—–-]\s*([^—–]+)$/);

    }

    // literal (fala exata)
    if (/^▸▸/.test(t)) { blocos.push({ k: "lit", t: t.replace(/^▸▸\s*/, ""), tags }); continue; }
    // versículo marcado na leitura do arquivo

    // rótulo de bloco
    if (/▸\s*$/.test(t)) { blocos.push({ k: "bloco", t: t.replace(/\s*▸\s*$/, "") }); continue; }
    // big ideia
    if (/^\[?\s*BIG\s*IDEIA\s*\]?\s*:?/i.test(t)) { blocos.push({ k: "big", t: t.replace(/^\[?\s*BIG\s*IDEIA\s*\]?\s*:?\s*/i, ""), tags }); continue; }

    if (/^(caminharemos|veremos|percorreremos)\b/i.test(t) && /\bI\s*[–-]/.test(t)) { blocos.push({ k: "map", t, tags }); continue; }
    // movimento romano
    const mov = t.match(/^([IVX]{1,4})\s*[–—-]\s*(.+)$/);
    if (mov && ROMANO.test(mov[1]) && mov[1].length) {
      let resto = mov[2].trim(), vv = "";

      if (mv) { vv = mv[1].trim(); resto = resto.slice(0, mv.index).trim(); }

    else if ((m = t.match(/^([a-hj-u-wyz])\s*[.)]\s+(.*)$/i))) { nivel = 1; mk = m[1].toLowerCase() + "."; t = m[2]; }
    else if ((m = t.match(/^(i{1,3}|iv|vi{0,3}|ix|x)\s*[.)]\s+(.*)$/i))) {

    const letras = t.replace(/[^A-Za-zÀ-ÿ]/g, "");
    if (letras.length > 1 && t === t.toUpperCase() && t.length <= 70) { blocos.push({ k: "head", t, tags }); nivelAnt = -1; continue; }
    // parágrafo solto
    blocos.push({ k: "it", n: 0, mk: "", t, tags });

}

/* Renumera os itens: a cada frase principal (número), as letras recomeçam em "a". */
function renumera(blocos) {
  let c0 = 0, c1 = 0, c2 = 0;
  for (const b of blocos) {
    if (b.k !== "it") { if (b.k === "head" || b.k === "mov" || b.k === "big" || b.k === "map") { c0 = 0; c1 = 0; c2 = 0; } continue; }
    if (!b.mk) continue;
    if (b.n === 0) { c0++; c1 = 0; c2 = 0; b.mk = c0 + "."; }
    else if (b.n === 1) { c1++; c2 = 0; b.mk = marcador(1, c1); }
    else { c2++; b.mk = marcador(2, c2); }
  }
  return blocos;
}

function metricas(blocos) {
  let corpo = 0, escritura = 0, ap = 0, il = 0, movs = 0;
  for (const b of blocos) {
    const n = (b.t || "").split(/\s+/).filter(Boolean).length;
    if (b.k === "verso") escritura += n; else if (b.k !== "titulo") corpo += n;
    if (b.k === "mov") movs++;
    (b.tags || []).forEach(([k]) => { if (k === "ap") ap++; if (k === "il") il++; });
  }
  return { corpo, escritura, ap, il, movs, cadencia: ap ? Math.round(corpo / ap) : 0 };
}

/* ========== leitura do arquivo do Word ==========
   Abre o .docx, segue a numeração automática do Word (1. / a. / i.) e marca
   os versículos em itálico, devolvendo o esboço como texto editável.        */
const ROM = ["i", "ii", "iii", "iv", "v", "vi", "vii", "viii", "ix", "x", "xi", "xii"];

  if (nivel <= 0) return n + ".";
  if (nivel === 1) return String.fromCharCode(97 + ((n - 1) % 26)) + ".";

  let t = "";

    for (const n of Array.from(r.childNodes)) {

async function lerArquivo(file) {
  const nome = (file.name || "").toLowerCase();
  if (/\.(txt|md|text)$/.test(nome)) return await file.text();
  if (/\.doc$/.test(nome)) throw new Error("O formato antigo .doc não abre aqui. Abra no Word e salve como .docx.");
  if (!/\.docx$/.test(nome)) throw new Error("Esse tipo de arquivo não é lido. Use .docx ou cole o texto.");
  if (!window.JSZip) throw new Error("O leitor de .docx não carregou. Verifique a conexão e recarregue a página.");
  let zip;
  try { zip = await JSZip.loadAsync(file); } catch (e) { throw new Error("Não consegui abrir o arquivo. Ele pode estar corrompido."); }
  const entrada = zip.file("word/document.xml");
  if (!entrada) throw new Error("Esse .docx não tem o conteúdo esperado do Word.");
  const xml = await entrada.async("string");

  // numeração que vem do estilo do parágrafo, não do parágrafo em si
  const porEstilo = {};
  try {
    const se = zip.file("word/styles.xml");
    if (se) {
      const sx = new DOMParser().parseFromString(await se.async("string"), "application/xml");
      const baseDe = {};
      for (const st of Array.from(sx.getElementsByTagName("w:style"))) {
        const id = st.getAttribute("w:styleId"); if (!id) continue;
        const bo = st.getElementsByTagName("w:basedOn")[0];
        if (bo) baseDe[id] = bo.getAttribute("w:val");
        const np = st.getElementsByTagName("w:numPr")[0];
        if (np) {
          const li = np.getElementsByTagName("w:ilvl")[0], ni = np.getElementsByTagName("w:numId")[0];
          if (ni) porEstilo[id] = { nivel: li ? (parseInt(li.getAttribute("w:val"), 10) || 0) : 0, numId: ni.getAttribute("w:val") };
        }
      }
      for (const id of Object.keys(baseDe)) {
        let a = id, n = 0;
        while (!porEstilo[a] && baseDe[a] && n++ < 6) a = baseDe[a];
        if (porEstilo[a] && !porEstilo[id]) porEstilo[id] = porEstilo[a];

      const est = pPr.getElementsByTagName("w:pStyle")[0];
      const doEstilo = est ? porEstilo[est.getAttribute("w:val")] : null;
      if (numPr || doEstilo) {
        const li = numPr ? numPr.getElementsByTagName("w:ilvl")[0] : null;
        const ni = numPr ? numPr.getElementsByTagName("w:numId")[0] : null;
        const nivel = li ? (parseInt(li.getAttribute("w:val"), 10) || 0) : (doEstilo ? doEstilo.nivel : 0);
        const numId = ni ? ni.getAttribute("w:val") : (doEstilo ? doEstilo.numId : "x");
        if (numId !== "0") {

}

/* ========== desenho do esboço ========== */
function corpoHTML(doc) {
  const frag = document.createDocumentFragment();
  const secs = [];
  let secAtual = null;
  const abreSec = (nome, node) => { node.classList.add("sec"); secs.push({ nome, node }); secAtual = node; };
  const etiquetas = tags => {
    if (!tags || !tags.length) return null;
    const lb = el("div", "labels");
    tags.forEach(([k, lbl]) => lb.appendChild(el("span", "tag " + k, lbl)));
    return lb;
  };
  const corDoBloco = tags => {
    const c = (tags || []).map(x => x[0]);
    return c.includes("ap") ? "ap" : c.includes("il") ? "il" : c.includes("sl") ? "sl" : "";
  };

  for (const b of doc.blocos) {
    let n;
    if (b.k === "titulo") {
      n = el("div"); const h = el("div", "doc-title", b.t); n.appendChild(h);
      if (b.sub) n.appendChild(el("div", "doc-sub", b.sub));
    } else if (b.k === "head") {
      n = el("div", "head");
      const lb = etiquetas(b.tags); if (lb) { lb.classList.add("cent"); n.appendChild(lb); }
      n.appendChild(document.createTextNode(b.t));
      if (!b.leve) abreSec(b.t.replace(/\s+/g, " ").trim(), n);
    } else if (b.k === "mov") {
      n = el("div", "mov");
      const lb = etiquetas(b.tags); if (lb) n.appendChild(lb);
      n.appendChild(el("div", "n", "MOVIMENTO " + b.n));
      const h = el("h2", null, b.t); n.appendChild(h);
      if (b.vv) n.appendChild(el("div", "vv", b.vv));
      abreSec(b.n + " – " + b.t, n);
    } else if (b.k === "big" || b.k === "map") {
      n = el("div", b.k === "big" ? "big" : "map");
      const lb = etiquetas(b.tags); if (lb) n.appendChild(lb);
      n.appendChild(document.createTextNode(b.t));
    }
    else if (b.k === "verso" || b.k === "lit") {
      n = el("div", b.k === "verso" ? "verse" : "lit");
      const lb = etiquetas(b.tags); if (lb) n.appendChild(lb);
      n.appendChild(document.createTextNode(b.t));
    }
    else if (b.k === "bloco") { n = el("div", "bloco", b.t); }
    else {
      const cor = corDoBloco(b.tags) || (b.n === 0 && b.mk ? "pr" : "");
      n = el("div", "it l" + b.n + (cor ? " mark m-" + cor : ""));
      n.appendChild(el("span", "mk", b.mk || ""));
      const tx = el("span", "tx");
      const lb = etiquetas(b.tags); if (lb) tx.appendChild(lb);
      tx.appendChild(document.createTextNode(b.t));
      n.appendChild(tx);
    }
    frag.appendChild(n);
  }
  frag.appendChild(el("div", "endpad"));
  return { frag, secs };
}

/* ========== pastas e ordem ========== */
/* o número que abre o título manda na ordem: 03 vem antes de 02 */
function numeroDoTitulo(s) {
  const m = String(s.titulo || "").match(/^\s*(\d{1,3})(?=\D|$)/);
  return m ? parseInt(m[1], 10) : null;
}
function ordenar(lista) {
  return lista.slice().sort((a, b) => {
    const na = numeroDoTitulo(a), nb = numeroDoTitulo(b);
    if (na !== null && nb !== null) return nb - na || (b.atualizadoEm || 0) - (a.atualizadoEm || 0);
    if (na !== null) return -1;
    if (nb !== null) return 1;
    return (b.atualizadoEm || 0) - (a.atualizadoEm || 0);
  });
}
function listaPastas() {
  const nomes = new Set(S.pastas || []);
  S.sermoes.forEach(s => { const n = (s.serie || "").trim(); if (n) nomes.add(n); });
  return [...nomes].sort((a, b) => a.localeCompare(b, "pt-BR"));
}
function daPasta(nome) { return ordenar(S.sermoes.filter(s => (s.serie || "").trim() === nome)); }

  nome = (nome || "").trim();
  if (!nome) return false;
  if (listaPastas().some(x => x.toLowerCase() === nome.toLowerCase())) { toast("Já existe uma pasta com esse nome."); return false; }
  S.pastas = [...(S.pastas || []), nome]; salvarLocal(); return true;
}
async function renomearPasta(velho, novo) {
  novo = (novo || "").trim(); if (!novo || novo === velho) return;
  S.pastas = (S.pastas || []).map(x => x === velho ? novo : x);
  if (!S.pastas.includes(novo)) S.pastas.push(novo);
  salvarLocal();

  salvarLocal(); S.pastaAberta = null; render();
}

/* ========== trilha e seções ========== */
function montaTrilha(secs) {
  const art = $("#sermao"); if (!art) return;
  const topo = art.offsetTop, altura = art.scrollHeight - art.querySelector(".endpad").offsetHeight;
  S.secs = secs.map((x, i) => {
    const ini = x.node.offsetTop - topo;
    return { nome: x.nome, node: x.node, ini, frac: Math.max(0, Math.min(1, ini / Math.max(1, altura))) };
  });
  if (!S.secs.length) S.secs = [{ nome: "Sermão", node: art.firstChild, ini: 0, frac: 0 }];
  if (S.secs[0].frac > 0.02) S.secs.unshift({ nome: "Abertura", node: art.firstChild, ini: 0, frac: 0 });
  S.secs.forEach((x, i) => { x.fim = i + 1 < S.secs.length ? S.secs[i + 1].frac : 1; });
  S.alturaConteudo = altura; S.topoConteudo = topo;

  const track = $("#track"); if (!track) return;
  track.innerHTML = "";
  S.secs.forEach((x, i) => {
    const seg = el("button", "seg"); seg.style.flexGrow = String(Math.max(0.04, x.fim - x.frac));
    seg.title = x.nome; seg.setAttribute("aria-label", "Ir para " + x.nome);
    seg.appendChild(el("i"));
    seg.onclick = () => x.node.scrollIntoView({ behavior: "smooth", block: "start" });
    track.appendChild(seg);
  });
  const tick = el("div", "ghost-tick"); tick.id = "tick"; track.appendChild(tick);
  window.addEventListener("scroll", aoRolar, { passive: true });
  aoRolar();
}

let rafPend = false;
function aoRolar() {
  if (rafPend) return; rafPend = true;
  requestAnimationFrame(() => { rafPend = false; pintaTempo(); });
}
function fracAtual() {
  const art = $("#sermao"); if (!art || !S.alturaConteudo) return 0;
  const y = window.scrollY + window.innerHeight * 0.34 - S.topoConteudo;
  return Math.max(0, Math.min(1, y / S.alturaConteudo));
}

/* ========== cronômetro ========== */
function decorrido() { return S.t.acum + (S.t.rodando ? Date.now() - S.t.t0 : 0); }
function alternaTimer() {
  if (S.t.rodando) { S.t.acum = decorrido(); S.t.rodando = false; pararTick(); $("#go").textContent = "▶"; }
  else {
    S.t.t0 = Date.now(); S.t.rodando = true; $("#go").textContent = "❚❚";
    S.tick = setInterval(pintaTempo, 250);
    pedirTelaAcesa();
  }
  pintaTempo();
}
function pararTick() { if (S.tick) { clearInterval(S.tick); S.tick = null; } }
async function pedirTelaAcesa() { try { if (navigator.wakeLock && !S.wl) S.wl = await navigator.wakeLock.request("screen"); } catch (e) { } }
function vibra(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { } }

function pintaTempo() {
  const s = S.atual; if (!s || S.view !== "pulpito") return;
  const alvoMs = s.alvo * 60000, ms = decorrido(), restante = alvoMs - ms;
  const clock = $("#clock"); if (!clock) return;
  clock.textContent = mmss(ms);
  const rem = $("#remain");
  rem.textContent = restante >= 0 ? mmss(restante) : "+" + mmss(-restante);
  rem.className = "num remain" + (restante < 0 ? " over" : restante <= 5 * 60000 ? " warn" : "");
  $("#remain-lbl").textContent = restante >= 0 ? "faltam de " + s.alvo + " min" : "passou do tempo";

  // avisos
  [[10, "d10"], [5, "d5"], [2, "d2"], [0, "d0"]].forEach(([min, chave]) => {
    if (!S.t.alertas[chave] && S.t.rodando && restante <= min * 60000) {
      S.t.alertas[chave] = true;
      const tb = $("#topbar"); if (tb) { tb.classList.remove("flash"); void tb.offsetWidth; tb.classList.add("flash"); setTimeout(() => tb.classList.remove("flash"), 3400); }
      vibra(min === 0 ? [180, 90, 180, 90, 180] : [140, 80, 140]);
      toast(min === 0 ? "Tempo cheio." : "Faltam " + min + " minutos.");
    }
  });

  // onde estou × onde deveria estar
  const fa = fracAtual(), fe = Math.max(0, Math.min(1, ms / alvoMs));
  const i = S.secs.length ? Math.max(0, S.secs.findIndex((x, k) => fa >= x.frac && fa < x.fim)) : -1;
  const sec = S.secs[i === -1 ? S.secs.length - 1 : i];
  if (sec) {
    $("#onde").textContent = sec.nome;
    const prevIni = sec.frac * s.alvo, prevFim = sec.fim * s.alvo;
    $("#prev").textContent = "previsto " + Math.round(prevIni) + "–" + Math.round(prevFim) + " min";
  }
  const idx = i === -1 ? S.secs.length - 1 : i;
  if (idx !== S.t.secAtual) {
    if (S.t.rodando || S.t.acum) S.t.log.push({ i: idx, t: ms });
    S.t.secAtual = idx;
  }
  const segs = document.querySelectorAll("#track .seg");
  segs.forEach((seg, k) => {
    const x = S.secs[k]; if (!x) return;
    seg.classList.toggle("cur", k === idx);
    const dentro = Math.max(0, Math.min(1, (fa - x.frac) / Math.max(0.0001, x.fim - x.frac)));
    seg.firstChild.style.width = (dentro * 100) + "%";
  });
  const tick = $("#tick"); if (tick) { tick.style.left = (fe * 100) + "%"; tick.classList.toggle("late", fe > fa); }

  const pace = $("#pace");
  if (!S.t.rodando && !S.t.acum) { pace.textContent = "parado"; pace.className = "pace"; }
  else {
    const dMin = (fa - fe) * s.alvo;
    const abs = Math.abs(dMin);
    if (abs < 0.75) { pace.textContent = "no ritmo"; pace.className = "pace ahead"; }
    else if (dMin > 0) { pace.textContent = "adiantado " + mmss(abs * 60000); pace.className = "pace ahead"; }
    else { pace.textContent = "atrasado " + mmss(abs * 60000); pace.className = "pace " + (abs > 4 ? "late" : "behind"); }
  }
}

function mudaFonte(d) {
  S.ps = Math.max(15, Math.min(36, S.ps + d));
  const art = $("#sermao"); if (art) art.style.setProperty("--ps", S.ps);
  salvarLocal();
  setTimeout(() => { if (S.secs.length) remedirSecoes(); }, 60);
}
function remedirSecoes() {
  const art = $("#sermao"); if (!art) return;
  const topo = art.offsetTop, altura = art.scrollHeight - art.querySelector(".endpad").offsetHeight;
  S.topoConteudo = topo; S.alturaConteudo = altura;
  S.secs.forEach(x => { x.frac = Math.max(0, Math.min(1, (x.node.offsetTop - topo) / Math.max(1, altura))); });
  S.secs.forEach((x, i) => { x.fim = i + 1 < S.secs.length ? S.secs[i + 1].frac : 1; });
  pintaTempo();
}

/* ========== resumo dos tempos ========== */
function abreResumo() {
  const s = S.atual, ms = decorrido();
  const reais = new Array(S.secs.length).fill(0);
  const log = S.t.log.slice();
  if (log.length) {
    for (let k = 0; k < log.length; k++) {
      const fim = k + 1 < log.length ? log[k + 1].t : ms;
      reais[log[k].i] += Math.max(0, fim - log[k].t);
    }
  }
  const scrim = el("div", "scrim"); scrim.onclick = fecha;
  const sh = el("div", "sheet");
  sh.appendChild(el("h3", null, "Tempos por movimento"));
  sh.appendChild(el("div", "eyebrow", mmss(ms) + " de " + s.alvo + " min previstos"));
  const tb = el("table", "tbl");
  tb.innerHTML = "<tr><th>Trecho</th><th>Previsto</th><th>Real</th><th style='text-align:right'>Dif.</th></tr>";
  S.secs.forEach((x, i) => {
    const prev = (x.fim - x.frac) * s.alvo * 60000, real = reais[i] || 0;
    const tr = el("tr");
    tr.appendChild(el("td", "nm", x.nome));
    tr.appendChild(el("td", null, mmss(prev)));
    tr.appendChild(el("td", null, real ? mmss(real) : "—"));
    const d = el("td", "d " + (real && real <= prev ? "ahead" : real ? "behind" : ""), real ? (real <= prev ? "−" : "+") + mmss(Math.abs(real - prev)) : "—");
    tr.appendChild(d);
    tb.appendChild(tr);
  });
  sh.appendChild(tb);
  const fecharBtn = el("button", "btn", "Fechar"); fecharBtn.style.marginTop = "14px"; fecharBtn.onclick = fecha;
  sh.appendChild(fecharBtn);
  document.body.appendChild(scrim); document.body.appendChild(sh);
  function fecha() { scrim.remove(); sh.remove(); }
}

/* ========== tema e avisos ========== */
function temaRotulo() { return S.tema === "dark" ? "Tema escuro" : S.tema === "light" ? "Tema claro" : "Tema do sistema"; }
function trocaTema() {
  S.tema = S.tema === null ? "dark" : S.tema === "dark" ? "light" : null;
  if (S.tema) document.documentElement.setAttribute("data-theme", S.tema); else document.documentElement.removeAttribute("data-theme");
  const o = lsGet(); o.tema = S.tema; lsSet(o);
  render();
}
let toastT = null;
function toast(msg) {
  const old = $(".toast"); if (old) old.remove();
  const t = el("div", "toast", msg); document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}
